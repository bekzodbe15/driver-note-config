name: Toggle Config

on:
  schedule:
    # Включить утром — 08:05 по Ташкенту
    - cron: '5 8 * * *'
      timezone: 'Asia/Tashkent'

    # Выключить вечером — 16:05 по Ташкенту
    - cron: '5 16 * * *'
      timezone: 'Asia/Tashkent'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  toggle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update config
        run: |
          HOUR=$(TZ=Asia/Tashkent date +%H)

          if [ "$HOUR" -ge 16 ] || [ "$HOUR" -lt 8 ]; then
            echo '{ "enabled": false}' > config.json
          else
            echo '{ "enabled": true}' > config.json
          fi

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config.json

          if ! git diff --cached --quiet; then
            git commit -m "Automatic config update"
            git push
          fi
