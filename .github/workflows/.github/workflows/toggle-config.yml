name: Toggle Config

on:
  schedule:
    # 08:00 по Ташкенту = включить
    - cron: '0 8 * * *'
      timezone: 'Asia/Tashkent'

    # 16:00 по Ташкенту = выключить
    - cron: '0 16 * * *'
      timezone: 'Asia/Tashkent'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  toggle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Change config
        run: |
          HOUR=$(TZ=Asia/Tashkent date +%H)

          if [ "$HOUR" -ge 16 ] || [ "$HOUR" -lt 8 ]; then
            echo '{ "enabled": false}' > config.json
          else
            echo '{ "enabled": true}' > config.json
          fi

      - name: Save change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Automatic config update"
            git push
          fi
